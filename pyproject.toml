[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]

[project]
name = "pysui-crypto"
version = "0.2.2"
description = "Python extension for Sui SEAL threshold encryption and zkLogin support"
readme = "README.rst"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
]

[project.urls]
homepage = "https://github.com/Suitters/pysui-crypto"
repository = "https://github.com/Suitters/pysui-crypto"
changelog = "https://github.com/Suitters/pysui-crypto/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "."

[tool.pylint.MASTER]
extension-pkg-allow-list = ["pysui_crypto"]
ignore-patterns = [".*\\.pyi$"]

[tool.pylint.messages_control]
disable = [
    "C0114",
    "C0115",
    "C0116",
]

[package]
name = "pysui-crypto"
version = "0.2.0"
license = "Apache-2.0"
edition = "2021"

[lib]
name = "pysui_crypto"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
rand = "0.8.6"
base64ct = { version = "1.8.3", features = ["alloc"] }
serde_json = "1.0"
num-bigint = "0.4"
fastcrypto = { version = "=0.1.9", features = ["aes"] }
fastcrypto-zkp = "=0.1.3"
bcs = "0.1.4"
serde = { version = "1", features = ["derive"] }
serde_with = "3.21.0"
itertools = "0.14.0"
chrono = "0.4"
hex = "0.4"
typenum = "1.20.1"
zeroize = { version = "1", features = ["derive"] }

[dependencies.pyo3]
version = "0.28.3"
features = ["abi3-py310"]

[patch.crates-io]
fastcrypto = { git = "https://github.com/MystenLabs/fastcrypto.git", rev = "c6010b9080b00e29d039a48c08898d90c2c1cbdd" }
fastcrypto-zkp = { git = "https://github.com/MystenLabs/fastcrypto.git", rev = "c6010b9080b00e29d039a48c08898d90c2c1cbdd" }

[package]
name = "pysui-crypto"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"

[lib]
name = "pysui_crypto"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
rand = "0.8.6"
base64ct = { version = "1.8.3", features = ["alloc"] }
serde_json = "1.0"
num-bigint = "0.4"
fastcrypto = "0.1.10"
fastcrypto-zkp = "0.1.4"
bcs = "0.1.4"

[dependencies.pyo3]
version = "0.28.3"
features = ["abi3-py310"]

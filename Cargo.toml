[package]
name = "pysui-crypto"
version = "0.2.3"
license = "Apache-2.0"
edition = "2021"

[lib]
name = "pysui_crypto"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
rand = "0.8.6"
base64ct = { version = "1.8.3", features = ["alloc"] }
serde_json = "1.0"
num-bigint = "0.4"
fastcrypto = { version = "=0.1.11", features = ["aes"] }
fastcrypto-zkp = "=0.1.4"
bcs = "0.1.4"
serde = { version = "1", features = ["derive"] }
serde_with = "3.21.0"
itertools = "0.14.0"
chrono = "0.4"
hex = "0.4"
typenum = "1.20.1"
zeroize = { version = "1", features = ["derive"] }
hkdf = "0.12.3"
sha2 = "0.10.6"

[dependencies.pyo3]
version = "0.28.3"
features = ["abi3-py310"]

